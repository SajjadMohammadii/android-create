name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck -S warning bin/android-create install.sh
      - name: Generate a sample project
        run: |
          mkdir -p /tmp/ws && cd /tmp/ws
          bash "$GITHUB_WORKSPACE/bin/android-create" SampleApp com.sample.app --no-open || true
          test -f SampleApp/app/build.gradle.kts
          test -x SampleApp/run-android.sh
          shellcheck -S warning SampleApp/run-android.sh
          python3 -c "import json; [json.load(open(f'SampleApp/.vscode/{n}.json')) for n in ('launch','tasks','settings')]"
